[package]
name = "streamsetu"
version = "0.1.0"
description = "StreamSetu for Windows: a browser and an IPTV player in one window"
edition = "2021"
rust-version = "1.80"

[lib]
name = "streamsetu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamsetu-core = { path = "../core" }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
